<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--preload-->
    <!-- Page metadata. scripts/seo-files.mjs writes a copy of this file per page with the
         right tags, for crawlers and link previews that don't run JavaScript. Tags marked
         data-static are removed at startup; React then renders the live set. -->
    <!--seo-->
    <title data-static>SAN Construction | Building spaces with purpose</title>
    <meta data-static name="description" content="SAN Construction plans and builds residential and commercial spaces with care, clarity and craft." />
    <!--/seo-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; color: #f5f2ec; background: #111111">
        This website needs JavaScript to display. Please enable it in your browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
